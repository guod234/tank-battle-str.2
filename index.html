<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>坦克大战 - STR</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="game-shell">
        <div class="game-frame">
          <canvas
            id="gameCanvas"
            width="960"
            height="640"
            tabindex="0"
            aria-label="坦克大战游戏画布"
          ></canvas>
        </div>
      </section>
      <footer class="controls-bar">
        <span>移动：WASD / 方向键</span>
        <span>射击：空格</span>
        <span>技能：1 - 5</span>
        <span>暂停：P</span>
        <span>重新开始：R</span>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
